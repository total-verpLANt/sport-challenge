{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2 class="mb-4">Changelog</h2>
    <div class="changelog-content">
      {{ changelog }}
    </div>
  </div>
</div>
{% endblock %}

{% block styles %}
<style nonce="{{ csp_nonce() }}">
  .changelog-content h2 { font-size: 1.4rem; margin-top: 2rem; border-bottom: 1px solid #dee2e6; padding-bottom: .4rem; }
  .changelog-content h3 { font-size: 1.1rem; margin-top: 1.2rem; color: #495057; }
  .changelog-content ul { padding-left: 1.4rem; }
  .changelog-content li { margin-bottom: .3rem; }
  .changelog-content code { background: #f8f9fa; padding: .1rem .35rem; border-radius: .25rem; font-size: .875em; }
</style>
{% endblock %}
